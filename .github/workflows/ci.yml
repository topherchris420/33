name: Project checks

on:
  push:
  pull_request:

jobs:
  evidence-review:
    name: Portable evidence review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and verify the committed evidence snapshot
        run: make review
      - name: Exercise the explicitly synthetic telemetry example
        run: make evidence-demo
      - name: Retain portable reports and source manifests
        uses: actions/upload-artifact@v4
        with:
          name: project33-evidence-${{ github.sha }}
          path: |
            build/review/
            build/demo/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  python-tests:
    name: Python docs and telemetry checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            Firmware/requirements.txt
            Firmware/requirements-test.txt
            Firmware/requirements-platformio.txt
            requirements-evidence.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Firmware/requirements-test.txt
          python -m pip install -r requirements-evidence.txt
      - name: Check generated protocol artifacts
        run: python tools/generate_protocol.py --check
      - name: Run evidence scripts and tests
        run: make evidence

  platformio-build:
    name: PlatformIO firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Firmware/requirements-platformio.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/lib
          key: ${{ runner.os }}-platformio-${{ hashFiles('Firmware/**/platformio.ini') }}
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Firmware/requirements-platformio.txt
      - name: Build rocket firmware
        run: pio run -d Firmware/Rocket
      - name: Prepare launcher WiFi config
        run: cp Firmware/Launcher/src/wifi_config.h.example Firmware/Launcher/src/wifi_config.h
      - name: Build launcher firmware
        run: pio run -d Firmware/Launcher
