; PlatformIO Project Configuration - Rocket Flight Computer
; 
; Build & upload:
;   pio run -e rocket -t upload
;
; Monitor serial:
;   pio device monitor -b 115200

[platformio]
default_envs = rocket

[env:rocket]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit MPU6050@2.2.9
    adafruit/Adafruit Unified Sensor@1.1.15
    madhephaestus/ESP32Servo@3.2.1
upload_speed = 921600

; Standalone observer image: excludes the flight and deployment translation units.
[env:rocket_monitor]
extends = env:rocket
build_src_filter = -<*> +<bench_monitor.cpp>
build_flags = -DPROJECT33_DIAGNOSTIC_FIRMWARE -DPROJECT33_MONITOR_ROCKET
lib_deps =
    adafruit/Adafruit MPU6050@2.2.9
    adafruit/Adafruit Unified Sensor@1.1.15

; Separate stationary pressure demonstrator; never links flight/actuator sources.
[env:altimeter_bench]
extends = env:rocket
lib_ldf_mode = deep+
build_src_filter = -<*> +<altimeter_bench.cpp>
build_flags = -DPROJECT33_ALTIMETER_BENCH
lib_deps = adafruit/Adafruit BMP085 Library@1.2.4
