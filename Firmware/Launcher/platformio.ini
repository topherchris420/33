; PlatformIO Project Configuration - Launcher Ground Station
;
; Build & upload:
;   pio run -e launcher -t upload
;
; Monitor serial:
;   pio device monitor -b 115200

[platformio]
default_envs = launcher

[env:launcher]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BMP085 Library@1.2.4
    mprograms/QMC5883LCompass@1.2.3
    mikalhart/TinyGPSPlus@1.1.0
    madhephaestus/ESP32Servo@3.2.1
upload_speed = 921600

; Standalone observer image: excludes launcher, networking and actuator code.
[env:launcher_monitor]
extends = env:launcher
lib_ldf_mode = deep+
build_src_filter = -<*> +<bench_monitor.cpp>
build_flags = -DPROJECT33_DIAGNOSTIC_FIRMWARE
lib_deps =
    adafruit/Adafruit BMP085 Library@1.2.4
    mprograms/QMC5883LCompass@1.2.3
    mikalhart/TinyGPSPlus@1.1.0
